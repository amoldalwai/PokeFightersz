<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=960,initial-scale=1">
<title>How to play</title>
<style>
  :root{--uif:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ch:#5b7cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:960px;height:480px;overflow:hidden;background:radial-gradient(110% 90% at 50% -10%,#22337a 0,#0d1330 55%,#070a18 100%);color:#e8edff;font:13px var(--uif);user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(60deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px),repeating-linear-gradient(-60deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px)}

  #wrap{position:absolute;left:10px;top:46px;box-sizing:content-box;width:620px;height:318px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.18);background:#000}

  .hi{opacity:1;z-index:6;animation:pl 1s ease-in-out infinite}

  .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) var(--a,0deg),transparent 0);pointer-events:none}
  #row2{position:absolute;left:10px;top:370px;width:624px;height:50px}

  .tb{display:flex;align-items:center;gap:8px;font:900 19px var(--uif);letter-spacing:3px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,#5b7cff,#3450e0);padding:9px 16px;color:#fff;margin-bottom:8px;filter:saturate(.6) brightness(.8);transition:transform .15s,filter .15s}

  .card{position:absolute;left:646px;top:46px;width:304px;height:424px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px 12px 18px;overflow-y:auto;touch-action:pan-y}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ch)}
  .cc{display:inline-block;font:900 10px var(--uif);letter-spacing:1.5px;color:#10142a;background:var(--ch);border-radius:99px;padding:2px 10px}
  .cn{float:right;font:800 11px var(--uif);color:#aab7d8}
  .card h3{font:900 20px var(--uif);margin:8px 0 3px;display:flex;gap:8px;align-items:center}.card h3 svg{width:22px;height:22px;color:var(--ch);flex:none}
  .lead{color:#c9d4f5;font-size:13px;line-height:1.35;margin-bottom:5px}
  .card ul{margin:0 0 8px;padding:0;list-style:none}.card li{font-size:12px;padding:4px 0 4px 16px;position:relative;line-height:1.35;border-top:1px solid rgba(255,255,255,.08)}

  .lab{font:700 10px var(--uif);letter-spacing:1px;color:#7f8aa3}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 7px}
  .kchip{display:flex;align-items:center;gap:6px;background:rgba(8,12,30,.55);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:3px 9px 3px 4px;font:700 11px var(--uif)}
  .kchip i{width:22px;height:22px;border-radius:50%;background:rgba(224,120,64,.5);border:1px solid rgba(255,200,160,.6);display:flex;align-items:center;justify-content:center;font-style:normal}.kchip i svg{width:60%;height:60%}
  .kchip .kk{font:800 10px var(--uif);background:#1b2550;border:1px solid rgba(255,255,255,.35);border-bottom-width:3px;border-radius:5px;padding:0 5px}
  .pro{background:rgba(255,226,122,.12);border:1px solid rgba(255,226,122,.45);border-radius:10px;padding:6px 10px;color:#ffe9a8;font-size:11.5px;line-height:1.35}.pro b{color:#ffd34d;letter-spacing:1px;font-size:10px}
</style></head><body>
<div id="top"><button class="chip" id="x">&#10005; CLOSE</button><div class="gt">HOW TO PLAY</div><button class="chip" id="rep">&#8635; REPLAY</button><button class="chip" id="slow">SLOW-MO</button><button class="chip sel" id="mt">TOUCH</button><button class="chip" id="mk">KEYS</button></div>

<div class="card" id="card"></div>
<script src="data/icons.js"></script>
<script src="data/bwa.js"></script>
<script>
const A='assets/',$=id=>document.getElementById(id),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

const ico=n=>`<svg viewBox="0 0 24 24" fill="currentColor"><path d="${ICON_PATH[n]||''}"/></svg>`;
function L(t,p){if(t<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(t<=p[i][0])return p[i-1][1]+(p[i][1]-p[i-1][1])*(t-p[i-1][0])/(p[i][0]-p[i-1][0]);return p[p.length-1][1];}
function E(t,p){if(t<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(t<=p[i][0])return p[i-1][1]+(p[i][1]-p[i-1][1])*sm((t-p[i-1][0])/(p[i][0]-p[i-1][0]));return p[p.length-1][1];}
function ST(t,p){let v=p[0][1];for(const q of p)if(t>=q[0])v=q[1];return v;}
const VW=780,VH=400,GY=332,KS=.72,AX=395,BX=540;

const cache={};const img=s=>cache[s]||(cache[s]=Object.assign(new Image(),{src:s}));
const TC={fire:'#ff7a3a',water:'#4aa8ff',grass:'#5fd35f',electric:'#ffd93a',fighting:'#d8574a',psychic:'#ff6ab0',ice:'#8fe3ff',ghost:'#9a7ad8',poison:'#b05ad8',ground:'#d8b05a',rock:'#b8a060',flying:'#9ab8ff',bug:'#a8d03a',dragon:'#6a5aff',normal:'#d8d0c0',steel:'#b8c4d8',dark:'#8a7a70'};
const S={a:{id:68,name:'machamp',types:['fighting']},b:{id:34,name:'nidoking',types:['poison','ground']}};const acol=()=>TC[S.a.types[0]]||'#ffb347';
// ---------- controls (positions copied from the game's touch layout)
const BTN=[
 {k:'tackle',n:'JAB',ic:'boxing-glove',key:['J'],st:'right:26px;bottom:26px;width:92px;height:92px'},
 {k:'leaf',n:'RANGED',ic:'leaf',key:['K'],st:'right:132px;bottom:20px;width:68px;height:68px'},
 {k:'vine',n:'SPECIAL 1',ic:'flash',key:['L'],st:'right:18px;bottom:132px;width:68px;height:68px'},
 {k:'special2',n:'SPECIAL 2',ic:'fire-circle',key:['O'],st:'right:104px;bottom:112px;width:62px;height:62px'},

 {k:'dash',n:'DASH',ic:'run-fast',cls:'blue',key:['Shift'],st:'right:214px;bottom:20px;width:56px;height:56px'},
 {k:'grab',n:'GRAB',ic:'hand-back-right',key:['G'],st:'right:246px;bottom:92px;width:52px;height:52px'},
 {k:'up',n:'JUMP',ic:'arrow-up-bold',key:['W'],st:'right:22px;bottom:212px;width:54px;height:54px'},
 {k:'guard',n:'GUARD',ic:'shield',cls:'blue',key:['S'],st:'left:30px;bottom:196px;width:52px;height:52px'},
 {k:'charge',n:'CHARGE',ic:'battery-charging',key:['U'],st:'left:96px;bottom:204px;width:52px;height:52px'},
 {k:'laneBack',n:'LANE BACK',ic:'chevron-up',cls:'blue',key:['Q'],st:'left:196px;bottom:92px;width:50px;height:50px'},
 {k:'laneFront',n:'LANE FRONT',ic:'chevron-down',cls:'blue',key:['E'],st:'left:196px;bottom:34px;width:50px;height:50px'},
 {k:'joy',n:'MOVE',ic:'swap-horizontal',key:['A','D'],txt:'walk left / right'}];
const BI=Object.fromEntries(BTN.map(b=>[b.k,b]));
const DESC={joy:'Walk left and right',up:'Jump',guard:'Block / parry',tackle:'Melee jab chain',leaf:'Ranged shot',vine:'Special move 1',special2:'Special move 2',special3:'Special move 3',beam:'Ultimate beam (50 KI)',charge:'Charge KI',dash:'Dash (14 stamina)',grab:'Grab and throw',laneBack:'Step to the background lane',laneFront:'Step to the foreground lane'};
$('touch').innerHTML=`<div id="joy" data-b="joy"><div id="stick"></div></div>`+BTN.filter(b=>b.st).map(b=>`<div class="btn ${b.cls||''}" data-b="${b.k}" style="${b.st}">${ico(b.ic)}<div class="cd"></div></div>`).join('');
$('kbd').innerHTML=[['MOVE',['joy']],['JUMP',['up']],['GUARD',['guard']],['JAB',['tackle']],['RANGED',['leaf']],['SPECIALS',['vine','special2','special3']],['BEAM',['beam']],['CHARGE',['charge']],['DASH',['dash']],['GRAB',['grab']],['LANES',['laneBack','laneFront']]]
 .map(([t,ks])=>`<div class="kg">${ks.map(k=>BI[k].key.map(x=>`<span class="kc" data-b="${k}">${x}</span>`).join('')).join('')}<small>${t}</small></div>`).join('');
// ---------- drawing
const cv=$('cv'),g=cv.getContext('2d');cv.width=VW*2;cv.height=VH*2;
const unitOf=m=>{const b=BWA[m.id];return clamp(130/Math.max(b.front.h,b.back.h),1.4,3.0);};
const frameAt=(m,side,t)=>{const d=BWA[m.id][side].d,tot=d.reduce((a,b)=>a+b,0);let tt=(t*60)%tot,i=0;while(i<d.length-1&&tt>=d[i]){tt-=d[i];i++;}return i;};
function sprOf(pose,side,t){const a=side==='A';
 switch(pose){case'back':return{k:'sheet',side:'back',fl:a?1:-1,t:t*1.4};case'atk':return{k:'still',dir:'p4',fl:a?-1:1};case'hg':return{k:'still',dir:'hg',fl:a?-1:1};
  case'hurt':case'down':return{k:'still',dir:'p3',fl:a?-1:1};default:return{k:'sheet',side:'front',fl:a?-1:1,t:t+(a?0:1.3)};}}
const D=o=>Object.assign({x:0,lane:0,lift:0,pose:'idle',rot:0,sx:1,sy:1,al:1,ghost:null},o);
function drawF(m,side,f,t){
 const sp=sprOf(f.pose||'idle',side,t),ls=1+.1*f.lane,ys=GY+f.lane*(f.lane<0?26:20),feet=ys-f.lift,sc=unitOf(m)*KS;let im,w,h,fr=0;
 if(sp.k==='sheet'){const I=BWA[m.id][sp.side];im=img(`${A}bwa/${m.name}_${sp.side}.png`);if(!im.complete||!im.naturalWidth)return;w=I.w*sc;h=I.h*sc;fr=frameAt(m,sp.side,sp.t);fr=[fr,I.w];}
 else{im=img(`${A}pose/${sp.dir}/${m.name}.png`);if(!im.complete||!im.naturalWidth)return;const k=clamp(BWA[m.id].front.w/im.naturalWidth,.6,1.5);w=im.naturalWidth*sc*k;h=im.naturalHeight*sc*k;}
 g.fillStyle=`rgba(0,0,0,${.32*(1-f.lift/260)*f.al})`;g.beginPath();g.ellipse(f.x,ys+3,46*ls*(1-f.lift/260),7*ls,0,0,6.283);g.fill();
 const one=(x,al)=>{g.save();g.imageSmoothingEnabled=false;g.globalAlpha=al;g.translate(Math.round(x),Math.round(feet));g.scale(ls*f.sx,ls*f.sy);const k=Math.min(1,Math.abs(f.rot)/1.5708);g.translate(0,-(1-k)*h/2-k*w/2);g.rotate(f.rot);g.scale(sp.fl,1);
  if(fr)g.drawImage(im,fr[0]*fr[1],0,fr[1],im.naturalHeight,-w/2,-h/2,w,h);else g.drawImage(im,-w/2,-h/2,w,h);g.restore();};
 if(f.ghost)for(const [dx,al] of f.ghost)one(f.x+dx,al*f.al);
 one(f.x,f.al);}
function bg(){const s=g.createLinearGradient(0,0,0,GY-20);s.addColorStop(0,'#1d2c58');s.addColorStop(1,'#6d86b8');g.fillStyle=s;g.fillRect(0,0,VW,GY-20);
 g.fillStyle='#ffffff14';g.beginPath();g.arc(620,70,44,0,6.283);g.fill();
 const f=g.createLinearGradient(0,GY-30,0,VH);f.addColorStop(0,'#bf9a62');f.addColorStop(1,'#8e6d3e');g.fillStyle=f;g.fillRect(0,GY-30,VW,VH);
 g.strokeStyle='#ffffff22';g.lineWidth=1;for(const y of[GY-26,GY,GY+20]){g.beginPath();g.moveTo(0,y+3);g.lineTo(VW,y+3);g.stroke();}}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function bar(x,y,w,h,v,col,rev,hl,t,lab){g.fillStyle='rgba(8,12,30,.82)';rr(x-2,y-2,w+4,h+4,h/2+2);g.fill();g.fillStyle=col;const ww=Math.max(0,w*clamp(v));rr(rev?x+w-ww:x,y,ww,h,h/2);g.fill();
 if(hl){g.strokeStyle=`rgba(255,211,77,${.6+.4*Math.sin(t*9)})`;g.lineWidth=2.5;rr(x-3,y-3,w+6,h+6,h/2+3);g.stroke();}
 if(lab){g.font='800 9px system-ui';g.fillStyle='#fff';g.textAlign=rev?'right':'left';g.fillText(lab,rev?x+w:x+w+6,y+h-(h>9?4:0));}}
function hud(h,t){const n=Object.assign({a:1,b:1,st:1,ki:.1,tm:'1:42',hl:''},h);
 bar(14,12,316,14,n.a,'#43d86a',false,n.hl==='hp',t);bar(450,12,316,14,n.b,'#43d86a',true,n.hl==='hp',t);
 bar(14,33,190,8,n.st,'#ffd34d',false,n.hl==='st',t,'STAMINA');bar(14,46,150,8,n.ki,'#5bc8ff',false,n.hl==='ki',t,'KI');
 g.font='900 12px system-ui';g.fillStyle='#fff';g.textAlign='left';g.fillText(S.a.name.toUpperCase(),16,9);g.textAlign='right';g.fillText(S.b.name.toUpperCase(),764,9);
 g.fillStyle='rgba(8,12,30,.85)';g.beginPath();g.arc(390,22,19,0,6.283);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.textAlign='center';g.font='900 12px system-ui';g.fillText(n.tm,390,26);}
function cap(txt){g.save();g.font='700 14px system-ui';const w=g.measureText(txt).width+28,x=VW/2-w/2,y=66;g.fillStyle='rgba(8,12,30,.85)';rr(x,y,w,28,14);g.fill();g.strokeStyle='#ffd34d';g.lineWidth=1.5;g.stroke();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,VW/2,y+14.5);g.restore();}
